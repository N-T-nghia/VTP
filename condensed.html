<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo rút gọn — Tiến độ công trình</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --green: #16a34a; --yellow: #ca8a04; --red: #dc2626; --accent: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #f1f5f9; color: var(--text); padding: 20px; font-size: 13px; line-height: 1.5; }
    .page { max-width: 820px; margin: 0 auto; background: white; padding: 32px 36px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--text); padding-bottom: 14px; margin-bottom: 20px; gap: 16px; }
    .page-header h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; }
    .page-header .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    .page-header .revision { text-align: right; font-size: 11px; color: var(--muted); }
    .page-header .revision strong { display: block; color: var(--text); font-size: 13px; }
    .hero { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; padding: 20px; background: #f8fafc; border-radius: 10px; margin-bottom: 20px; }
    .rag-circle { width: 140px; height: 140px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 800; margin: 0 auto; }
    .rag-circle .big { font-size: 34px; line-height: 1; }
    .rag-circle .label { font-size: 12px; font-weight: 600; opacity: 0.9; margin-top: 4px; }
    .rag-circle.green { background: var(--green); } .rag-circle.yellow { background: var(--yellow); } .rag-circle.red { background: var(--red); }
    .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .stat .value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
    .stat .sub { font-size: 11px; color: var(--muted); }
    .note { padding: 11px 14px; background: #eff6ff; border-left: 3px solid var(--accent); font-size: 12.5px; border-radius: 6px; margin-bottom: 20px; line-height: 1.55; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .box h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 800; color: var(--muted); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .box ul { list-style: none; }
    .box li { padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 12.5px; display: flex; gap: 8px; }
    .box li:last-child { border-bottom: none; }
    .box li::before { content: "▪"; color: var(--muted); flex-shrink: 0; font-size: 14px; line-height: 1.2; }
    .box.issues li::before { color: var(--red); }
    .box.measures li::before { color: var(--accent); }
    .milestones-row { display: flex; gap: 0; overflow-x: auto; margin-bottom: 20px; padding-bottom: 6px; }
    .ms { flex-shrink: 0; min-width: 130px; position: relative; padding: 10px 12px 0 0; border-top: 2px solid var(--border); }
    .ms::before { content: ""; position: absolute; top: -6px; left: 0; width: 11px; height: 11px; border-radius: 50%; background: white; border: 3px solid var(--muted); }
    .ms.done::before { border-color: var(--green); background: var(--green); }
    .ms.late::before { border-color: var(--red); background: var(--red); }
    .ms.upcoming::before { border-color: var(--accent); }
    .ms .name { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
    .ms .date { font-size: 11px; color: var(--muted); }
    .hero-photo { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #f1f5f9; }
    .photo-caption { font-size: 11.5px; color: var(--muted); margin-bottom: 20px; }
    .footer { border-top: 1px solid var(--border); padding-top: 12px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .actions { max-width: 820px; margin: 0 auto 16px; display: flex; gap: 8px; justify-content: flex-end; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: white; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.primary { background: var(--text); color: white; border-color: var(--text); }
    .error-box { max-width: 820px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; text-align: center; font-family: "Inter", sans-serif; color: var(--red); }
    @media print {
      body { background: white; padding: 0; font-size: 11px; }
      .page { max-width: 100%; padding: 14mm 12mm; box-shadow: none; border-radius: 0; }
      .actions { display: none; }
      .hero, .columns, .box { page-break-inside: avoid; }
      @page { size: A4; margin: 0; }
    }
    @media (max-width: 640px) {
      .page { padding: 20px; } .hero { grid-template-columns: 1fr; gap: 16px; }
      .columns { grid-template-columns: 1fr; } .hero-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="actions">
  <a href="index.html" class="btn">← Dashboard đầy đủ</a>
  <button class="btn primary" onclick="window.print()">In / Lưu PDF</button>
</div>

<div class="page">
  <div class="page-header">
    <div><h1 id="project-name">—</h1><div class="meta" id="project-meta">—</div></div>
    <div class="revision" id="revision">—</div>
  </div>
  <div class="hero">
    <div class="rag-circle" id="rag-circle"><span class="big" id="rag-pct">—%</span><span class="label" id="rag-label">—</span></div>
    <div class="hero-stats">
      <div class="stat"><div class="label">Kế hoạch</div><div class="value" id="stat-planned">—%</div><div class="sub" id="stat-planned-sub"></div></div>
      <div class="stat"><div class="label">Chênh lệch</div><div class="value" id="stat-delta">—%</div><div class="sub" id="stat-delta-sub"></div></div>
      <div class="stat"><div class="label">SPI</div><div class="value" id="stat-spi">—</div><div class="sub" id="stat-spi-sub"></div></div>
      <div class="stat"><div class="label">Dự báo HT</div><div class="value" id="stat-forecast" style="font-size:15px">—</div><div class="sub">Theo xu hướng hiện tại</div></div>
    </div>
  </div>
  <div class="note" id="summary-note">—</div>
  <div class="columns">
    <div class="box issues"><h3>⚠ Khó khăn chính</h3><ul id="issues-list"></ul></div>
    <div class="box measures"><h3>🛠 Biện pháp đang thực hiện</h3><ul id="measures-list"></ul></div>
  </div>
  <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.6px;font-weight:800;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border)">Mốc tiến độ chính</h3>
  <div class="milestones-row" id="milestone-row"></div>
  <div id="hero-photo-wrap"></div>
  <div class="footer">
    <span id="footer-left">—</span><span id="footer-right">—</span>
  </div>
</div>

<script src="data.js"></script>
<script src="compute.js"></script>
<script>
(function () {
  const useLocal = new URLSearchParams(location.search).has("preview");
  const local = useLocal ? localStorage.getItem("reportData") : null;
  const raw = local ? JSON.parse(local) : window.reportData;
  const r = window.ComputeEngine ? window.ComputeEngine.computeAll(raw) : raw;

  if (!r) {
    document.body.innerHTML = '<div class="error-box">❌ Không tải được data.js</div>';
    return;
  }
  const fmt = s => s ? String(s).split("-").reverse().join("/") : "—";
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

  document.getElementById("project-name").textContent = r.project.name;
  document.getElementById("project-meta").textContent = `${r.project.code} · ${r.project.location} · CĐT: ${r.project.investor}`;
  document.getElementById("revision").innerHTML = `<strong>${esc(r.project.revision)}</strong>Cập nhật ${fmt(r.project.reportDate)}`;

  const delta = +(r.summary.actual - r.summary.planned).toFixed(1);
  const ragClass = delta >= -0.5 ? "green" : delta >= -5 ? "yellow" : "red";
  const ragLabel = delta >= -0.5 ? "ĐÚNG TIẾN ĐỘ" : delta >= -5 ? "CẢNH BÁO" : "CHẬM";
  document.getElementById("rag-circle").classList.add(ragClass);
  document.getElementById("rag-pct").textContent = r.summary.actual + "%";
  document.getElementById("rag-label").textContent = ragLabel;

  document.getElementById("stat-planned").textContent = r.summary.planned + "%";
  document.getElementById("stat-planned-sub").textContent = "theo baseline";
  document.getElementById("stat-delta").textContent = (delta >= 0 ? "+" : "") + delta + "%";
  document.getElementById("stat-delta-sub").textContent = delta < 0 ? `chậm ${r.summary.daysBehind} ngày` : "vượt kế hoạch";
  document.getElementById("stat-spi").textContent = Number(r.summary.spi).toFixed(3);
  document.getElementById("stat-spi-sub").textContent = r.summary.spi >= 1 ? "đúng KH" : "đang chậm";
  document.getElementById("stat-forecast").textContent = fmt(r.summary.forecastFinish);

  document.getElementById("summary-note").textContent = r.summary.note;

  const sevRank = { high: 0, medium: 1, low: 2 };
  const topIssues = [...(r.risks || [])].sort((a, b) => (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9)).slice(0, 3);
  document.getElementById("issues-list").innerHTML = topIssues.map(x => `<li><span><strong>${esc(x.id)}</strong> — ${esc(x.description)}</span></li>`).join("");

  const topMeasures = [...(r.measures || [])].sort((a, b) => (a.status === "Hoàn thành" ? 1 : 0) - (b.status === "Hoàn thành" ? 1 : 0)).slice(0, 3);
  document.getElementById("measures-list").innerHTML = topMeasures.map(x => `<li><span>${esc(x.action)} <em style="color:var(--muted);font-style:normal;font-size:11px">(${esc(x.deadline)})</em></span></li>`).join("");

  const mss = (r.milestones || []).slice(-5);
  document.getElementById("milestone-row").innerHTML = mss.map(m => {
    const cls = m.status === "done" ? "done" : m.status === "late" ? "late" : "upcoming";
    const dateStr = m.actual ? "TT: " + fmt(m.actual) : "KH: " + fmt(m.planned);
    return `<div class="ms ${cls}"><div class="name">${esc(m.name)}</div><div class="date">${dateStr}</div></div>`;
  }).join("");

  if (r.photos && r.photos.length) {
    const latest = [...r.photos].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")))[0];
    document.getElementById("hero-photo-wrap").innerHTML = `<img class="hero-photo" src="${esc(latest.url)}" alt="${esc(latest.caption || "")}"><div class="photo-caption">${esc(latest.caption || "")} · ${esc(latest.location || "")} · ${fmt(latest.date)}</div>`;
  }

  document.getElementById("footer-left").textContent = `Người lập: ${r.project.preparedBy}`;
  document.getElementById("footer-right").textContent = `Phê duyệt: ${r.project.approvedBy}`;
})();
</script>
</body>
</html>
